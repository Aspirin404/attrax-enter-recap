<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttraX × Enter — Vibe Coding Workshop Recap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- ── Nav ─────────────────────────────────────────────────── -->
<nav>
  <div class="nav-logo"></div>
  <div class="nav-meta"></div>
  <a class="nav-cta" href="#" target="_blank"></a>
</nav>

<!-- ── Hero ────────────────────────────────────────────────── -->
<div class="hero">
  <div>
    <div class="pill-tag"></div>
    <h1></h1>
    <p class="hero-sub"></p>
    <div class="hero-tags"></div>
  </div>
  <div class="hero-visual">
    <div class="pc pc1"><img src="" alt="photo 1"></div>
    <div class="pc pc2"><img src="" alt="photo 2"></div>
    <div class="pc pc3"><img src="" alt="photo 3"></div>
  </div>
</div>

<!-- ── Stats Bar ────────────────────────────────────────────── -->
<div class="stats">
  <div class="si"><!-- filled by JS --></div>
</div>

<!-- ── Overview ─────────────────────────────────────────────── -->
<section id="overview">
  <div class="wrap">
    <div class="spill pp"></div>
    <h2></h2>
    <p class="sub"></p>
    <div class="og">
      <div class="ot"><!-- body + quote filled by JS --></div>
      <div class="scards">
        <div class="sc agenda">
          <div class="sct"></div>
          <div class="flist"></div>
        </div>
        <div class="sc sponsors">
          <div class="sct"></div>
          <div class="pills"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ── Projects ─────────────────────────────────────────────── -->
<section id="projects" class="wbg">
  <div class="wrap">
    <div class="spill pp"></div>
    <h2></h2>
    <p class="sub"></p>
    <div class="pgrid"><!-- filled by JS --></div>
  </div>
</section>

<!-- ── Participants ──────────────────────────────────────────── -->
<section id="participants">
  <div class="wrap">
    <div class="spill pp"></div>
    <h2></h2>
    <p class="sub"></p>
    <div class="pstats"><!-- filled by JS --></div>
    <div class="ptable">
      <div class="ptrow">
        <div class="ptlabel">Programs</div>
        <div class="st-wrap programs-wrap"></div>
      </div>
      <div class="ptrow">
        <div class="ptlabel">Schools</div>
        <div class="st-wrap schools-wrap"></div>
      </div>
    </div>
  </div>
</section>

<!-- ── Gallery ───────────────────────────────────────────────── -->
<section id="gallery" class="gbg">
  <div class="wrap">
    <div class="spill pg"></div>
    <h2></h2>
    <div class="gg"><!-- filled by JS --></div>
    <div class="glink"></div>
  </div>
</section>

<!-- ── CTA ───────────────────────────────────────────────────── -->
<section class="pct">
  <div class="wrap">
    <div class="pg2">
      <div>
        <div class="ptitle">Made Possible By</div>
        <div class="ppills"><!-- filled by JS --></div>
      </div>
      <div class="cbox">
        <div class="ce"></div>
        <h2></h2>
        <p></p>
        <div class="cbtns"><!-- filled by JS --></div>
      </div>
    </div>
  </div>
</section>

<!-- ── Footer ────────────────────────────────────────────────── -->
<footer>
  <div class="fl"></div>
  <div class="fr"></div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
